name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 3.81.225.222
          username: fabian.capellino
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/fabian.capellino/app"

      - name: Pull image and restart containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.81.225.222
          username: fabian.capellino
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            export DOCKERHUB_USER=${{ secrets.DOCKERHUB_USERNAME }}
            export APP_VERSION="v1.${{ github.event.workflow_run.run_number }}"
            export COMMIT_MSG="${{ github.event.workflow_run.head_commit.message }}"
            docker compose pull
            docker compose up -d